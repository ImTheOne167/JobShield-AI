<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recruiter Verify - JobShield AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<div class="app-container">


    <main class="main-content">


        <!-- TOP BAR -->

        <header class="topbar">

            <div>
                <h3>Recruiter Verification</h3>
            </div>

            <div class="top-right">

                <span>

                    <i class="bi bi-person-circle"></i>

                    Guest User

                </span>

            </div>

        </header>



        <div class="content">


            <!-- WELCOME CARD -->

            <section class="welcome-card">


                <div class="welcome-text">


                    <h1>

                        <span>Verify a Recruiter</span>

                    </h1>


                    <p>

                        Check recruiter details and identify
                        potentially suspicious recruitment activity.

                    </p>


                    <a
                        href="/"
                        class="btn-primary-custom"
                    >

                        <i class="bi bi-arrow-left"></i>

                        Back to Dashboard

                    </a>


                </div>



                <div class="welcome-icon">

                    <div class="big-shield">

                        <i class="bi bi-person-check"></i>

                    </div>

                </div>


            </section>



            <!-- RECRUITER VERIFICATION FORM -->

            <section class="analysis-card">


                <div class="section-title">


                    <i class="bi bi-person-check"></i>


                    <div>

                        <h3>Recruiter Verification</h3>

                        <p>

                            Enter recruiter information to verify
                            their authenticity.

                        </p>

                    </div>


                </div>



                <form id="recruiterForm">


                    <!-- RECRUITER NAME -->

                    <div class="form-group">

                        <label>

                            Recruiter Name <span>*</span>

                        </label>


                        <input
                            type="text"
                            id="recruiter_name"
                            class="form-control"
                            placeholder="Enter recruiter name"
                            required
                        >

                    </div>



                    <!-- RECRUITER EMAIL -->

                    <div class="form-group mt-3">

                        <label>

                            Recruiter Email <span>*</span>

                        </label>


                        <input
                            type="email"
                            id="recruiter_email"
                            class="form-control"
                            placeholder="recruiter@example.com"
                            required
                        >

                    </div>



                    <!-- COMPANY -->

                    <div class="form-group mt-3">

                        <label>

                            Company Name <span>*</span>

                        </label>


                        <input
                            type="text"
                            id="company_name"
                            class="form-control"
                            placeholder="Enter company name"
                            required
                        >

                    </div>



                    <!-- LINKEDIN -->

                    <div class="form-group mt-3">

                        <label>

                            LinkedIn Profile

                        </label>


                        <input
                            type="url"
                            id="linkedin"
                            class="form-control"
                            placeholder="https://linkedin.com/in/recruiter"
                        >

                    </div>



                    <!-- VERIFY BUTTON -->

                    <button
                        type="submit"
                        class="analyze-button mt-4"
                    >

                        <i class="bi bi-shield-check"></i>

                        Verify Recruiter

                    </button>


                </form>



                <!-- RESULT -->

                <div
                    id="recruiterResult"
                    class="mt-4"
                ></div>


            </section>



            <!-- FOOTER -->

            <footer>

                © 2026 JobShield AI. All rights reserved.

            </footer>


        </div>


    </main>


</div>



<!-- RECRUITER VERIFICATION JAVASCRIPT -->

<script>


document
.getElementById("recruiterForm")
.addEventListener("submit", async function(event) {


    event.preventDefault();



    const recruiterName =
        document
        .getElementById("recruiter_name")
        .value;



    const recruiterEmail =
        document
        .getElementById("recruiter_email")
        .value;



    const companyName =
        document
        .getElementById("company_name")
        .value;



    const linkedin =
        document
        .getElementById("linkedin")
        .value;



    const resultBox =
        document
        .getElementById("recruiterResult");



    resultBox.innerHTML =

        "<p>Verifying recruiter...</p>";



    try {


        const response =
            await fetch(
                "/verify-recruiter",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        recruiter_name:
                            recruiterName,

                        recruiter_email:
                            recruiterEmail,

                        company_name:
                            companyName,

                        linkedin:
                            linkedin

                    })

                }
            );



        const data =
            await response.json();



        resultBox.innerHTML = `


            <div class="analysis-card">


                <h3>

                    <i class="bi bi-shield-check"></i>

                    Verification Result

                </h3>



                <p>

                    <strong>Recruiter:</strong>

                    ${data.recruiter_name}

                </p>



                <p>

                    <strong>Email:</strong>

                    ${data.recruiter_email}

                </p>



                <p>

                    <strong>Company:</strong>

                    ${data.company_name}

                </p>



                <hr>



                <h4>

                    ${data.verification}

                </h4>



                <!-- RISK SCORE -->

                <div class="mt-3">


                    <strong>

                        Risk Score:
                        ${data.risk_score}%

                    </strong>



                    <div
                        class="progress mt-2"
                        style="height: 12px;"
                    >


                        <div
                            class="progress-bar bg-danger"
                            role="progressbar"
                            style="width: ${data.risk_score}%"
                            aria-valuenow="${data.risk_score}"
                            aria-valuemin="0"
                            aria-valuemax="100"
                        >

                        </div>


                    </div>


                </div>



                <h5 class="mt-4">

                    Reasons:

                </h5>



                <ul>

                    ${data.reasons
                        .map(
                            reason =>
                            `<li>${reason}</li>`
                        )
                        .join("")}

                </ul>


            </div>

        `;


    }


    catch (error) {


        resultBox.innerHTML = `

            <div class="alert alert-danger">

                Unable to verify recruiter.
                Please try again.

            </div>

        `;


        console.error(error);


    }


});


</script>


</body>

</html>
